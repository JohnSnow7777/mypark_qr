<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이파크 M 다운로드</title>
    <!-- 파비콘 추가 -->
    <link rel="icon" type="image/png" href="img/MYPARK_blue_LOGO.png">

    <script>
        window.onload = function () {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            var iosLink = "https://apps.apple.com/kr/app/%EB%A7%88%EC%9D%B4%ED%8C%8C%ED%81%AC-m/id6769627482";
            var androidLink = "https://play.google.com/store/apps/details?id=com.smilesquare.mypark2&pcampaignid=web_share";

            // iOS 기기 감지
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosLink);
            }
            // 안드로이드 기기 감지
            else if (/android/i.test(userAgent)) {
                window.location.replace(androidLink);
            }
            // PC 등 기타 기기일 경우 버튼 화면 표시
            else {
                document.getElementById('fallback').style.display = 'flex';
                document.getElementById('loading').style.display = 'none';
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #2272ED;
            /* 추출한 파란 로고 색상 */
            color: white;
            /* 어두운 배경에 맞게 글씨를 흰색으로 */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-logo {
            max-width: 250px;
            /* 로고 크기 조정 */
            margin-bottom: 40px;
        }

        h2 {
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.4;
        }

        #fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* 버튼 사이 간격 */
        }

        .btn {
            display: grid;
            grid-template-columns: 46px 1fr;
            align-items: center;
            padding: 0 16px; /* 로고를 더 왼쪽으로 밀기 위해 좌측 여백 축소 */
            height: 60px; /* 애플과 구글 버튼의 상하 크기를 완벽하게 동일하게 고정 */
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            width: 340px;
            transition: opacity 0.2s;
            box-sizing: border-box;
        }

        .btn-ios {
            background-color: #000000;
        }

        .btn-android {
            background-color: #3DDC84;
            color: #000;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn img {
            height: 34px;
            max-width: 46px;
            object-fit: contain;
            justify-self: start; /* 로고 이미지를 구역 내에서 맨 왼쪽으로 정렬 */
        }

        .btn-ios img {
            height: 42px; /* 로고 크기를 키우되, 버튼 높이(60px) 내에 딱 맞게 조정 */
        }

        .btn span {
            text-align: left;
            padding-left: 12px;
        }
    </style>
</head>

<body>
    <!-- 페이지 맨 위 로고 -->
    <img src="img/mypark_white_slice.png" alt="마이파크 M" class="top-logo">

    <div id="loading">
        <h2>기기에 맞는 앱스토어로 이동 중입니다... 🚀</h2>
    </div>
    <div id="fallback">
        <!-- <h2>사용 중인 기기의 스토어를<br>선택해주세요.</h2> -->
        <!-- 텍스트 버튼 안에 로고 삽입 -->
        <a href="https://apps.apple.com/kr/app/%EB%A7%88%EC%9D%B4%ED%8C%8C%ED%81%AC-m/id6769627482" class="btn btn-ios">
            <img src="img/apple.png" alt="Apple">
            <span>App Store (아이폰)</span>
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.smilesquare.mypark2&pcampaignid=web_share"
            class="btn btn-android">
            <img src="img/google.png" alt="Google">
            <span>Google Play (안드로이드)</span>
        </a>
    </div>
</body>

</html>
