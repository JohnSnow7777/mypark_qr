<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 다운로드</title>
    <script>
        window.onload = function () {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // TODO: 실제 앱의 다운로드 주소로 변경해주세요.
            var iosLink = "https://apps.apple.com/kr/app/%EB%A7%88%EC%9D%B4%ED%8C%8C%ED%81%AC-m/id6769627482";
            var androidLink = "https://play.google.com/store/apps/details?id=com.smilesquare.mypark2&pcampaignid=web_share";

            // iOS 기기 감지
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosLink);
            }
            // 안드로이드 기기 감지
            else if (/android/i.test(userAgent)) {
                window.location.replace(androidLink);
            }
            // PC 등 기타 기기일 경우 버튼 화면 표시
            else {
                document.getElementById('fallback').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f8f9fa;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            width: 250px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-ios {
            background-color: #000000;
        }

        .btn-android {
            background-color: #3DDC84;
            color: #000;
        }

        #fallback {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loading">
        <h2>기기에 맞는 앱스토어로 이동 중입니다... 🚀</h2>
    </div>
    <div id="fallback">
        <h2>사용 중인 기기의 스토어를 선택해주세요.</h2>
        <a href="https://apps.apple.com/kr/app/%EB%A7%88%EC%9D%B4%ED%8C%8C%ED%81%AC-m/id6769627482"
            class="btn btn-ios">App Store (아이폰)</a><br>
        <a href="https://play.google.com/store/apps/details?id=com.smilesquare.mypark2&pcampaignid=web_share"
            class="btn btn-android">Google Play (안드로이드)</a>
    </div>
</body>

</html>
